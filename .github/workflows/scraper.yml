name: Scraper concours emploi-public.ma

on:
  schedule:
    # Toutes les heures, jour et nuit
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis GitHub

permissions:
  contents: write  # autorise le workflow à sauvegarder les résultats dans le dépôt
  issues: write    # autorise le workflow à créer des Issues de validation

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le scraper
        run: python scraper.py

      - name: Créer les Issues de validation
        run: python creer_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sauvegarder les résultats dans le dépôt
        run: |
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des concours détectés"
          git push
